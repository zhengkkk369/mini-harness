name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration: the portability defects this repository has
        # collected -- a POSIX-only os.getuid() call, a pipe decoded with the
        # machine's locale codec, npx.CMD not being spawnable by name, a log
        # directory hardcoded to /logs/agent -- were all invisible to a Linux-only
        # matrix. One Windows entry is enough to keep them from coming back.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    env:
      DEEPSEEK_API_KEY: ci-dummy-not-a-real-key
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check source
        run: |
          uv run --locked ruff check src tests bench tui.py
          uv run --locked python -m compileall -q src tests bench
      - name: Run the offline test suite
        run: uv run --locked pytest
      # One line per test file, plus the total, so a platform that collects a
      # different set is visible in the log instead of only in a count. -o
      # addopts= clears the configured -q, which would suppress the listing.
      - name: Record what the suite collected
        run: uv run --locked pytest -o addopts= --collect-only -q
      - name: Check imports, tool schemas, and CLI offline
        run: |
          uv run --locked python -c "from mini_harness.agent import DeepSeekAgent; from mini_harness.tool.box import TOOLS; assert len(DeepSeekAgent(TOOLS).tools) == 12"
          uv run --locked mini-harness --help
      # A separate step, because `VAR=value command` is not what every shell on
      # the matrix does; the environment is the portable way to say it.
      - name: Check the bench profile starts
        env:
          MINI_HARNESS_PROFILE: bench
        run: uv run --locked mini-harness --help
      - name: Check TUI entry point offline
        run: uv run --script tui.py --help
      - name: Build package
        run: uv build
